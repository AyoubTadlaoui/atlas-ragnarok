background-opacity = 1
window-decoration = true
window-padding-x = 24
window-padding-y = 20

# Pure black terminal background — no half-measures
background = #000000
foreground = #ffffff

# Deep-navy selection with slight thunder tint
selection-background = #1e3a5f
selection-foreground = #ffffff

# Cursor adopts the brand thunder-blue
cursor-color = #3b82f6
cursor-text = #ffffff

# ── ANSI palette ─────────────────────────────────────────────────
#   #3b82f6 thunder-blue  — Functions, Numbers, Types, Tags
#   #99ffe4 peppermint    — Strings, Symbols, git-added
#   #a0a0a0 gray          — Keywords, Operators, Storage
#   #ff8080 crimson       — Errors, Invalid, git-deleted
#   #ffffff white         — Variables, plain identifiers

# Standard
palette = 0=#000000
palette = 1=#ff8080
palette = 2=#99ffe4
palette = 3=#2563eb
palette = 4=#a0a0a0
palette = 5=#3b82f6
palette = 6=#99ffe4
palette = 7=#ffffff

# Bright
palette = 8=#505050
palette = 9=#ff9999
palette = 10=#b3ffe4
palette = 11=#60a5fa
palette = 12=#b0b0b0
palette = 13=#93c5fd
palette = 14=#99ffe4
palette = 15=#ffffff

# ── Storm/fire vignette shader ───────────────────────────────────
# Thunder-blue glow at the top edge, crimson at the bottom,
# pure black through the middle ~60% of the screen. Background-only
# (text never gets tinted). Tweak intensities directly in the .glsl.
custom-shader = ~/.config/ghostty/shaders/atlas-ragnarok.glsl
custom-shader-animation = false
