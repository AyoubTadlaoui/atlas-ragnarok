# atlas-ragnarok — Kitty palette port
#
# Install:
#   cp themes/kitty.conf ~/.config/kitty/atlas-ragnarok.conf
#   # then in ~/.config/kitty/kitty.conf:
#   include atlas-ragnarok.conf
#
# Or via kitten themes:
#   kitten themes --reload-in=all atlas-ragnarok
#   (after submitting to the kitty-themes repo)
#
# The vignette shader (atlas-ragnarok.glsl) is Ghostty-exclusive —
# Kitty doesn't support custom GLSL shaders.

# ─── Basic ───────────────────────────────────────────────────────
foreground            #ffffff
background            #000000
selection_foreground  #ffffff
selection_background  #1e3a5f

# ─── Cursor ──────────────────────────────────────────────────────
cursor                #3b82f6
cursor_text_color     #ffffff

# ─── URL underline color when hovering ───────────────────────────
url_color             #99ffe4

# ─── Window borders ──────────────────────────────────────────────
active_border_color   #3b82f6
inactive_border_color #505050
bell_border_color     #ff8080

# ─── Tab bar ─────────────────────────────────────────────────────
active_tab_foreground   #000000
active_tab_background   #3b82f6
active_tab_font_style   bold
inactive_tab_foreground #a0a0a0
inactive_tab_background #000000
inactive_tab_font_style normal

# ─── ANSI palette (standard) ─────────────────────────────────────
color0  #000000
color1  #ff8080
color2  #99ffe4
color3  #2563eb
color4  #a0a0a0
color5  #3b82f6
color6  #99ffe4
color7  #ffffff

# ─── ANSI palette (bright) ───────────────────────────────────────
color8  #505050
color9  #ff9999
color10 #b3ffe4
color11 #60a5fa
color12 #b0b0b0
color13 #93c5fd
color14 #99ffe4
color15 #ffffff
